# MySQL 配置
[mysql]
host = localhost
# 实际工作中不会去用root账号，尤其是开发人员，尤其是生产环境
user = root
password = 123456
database = subjects

# Redis 配置
[redis]
host = localhost
port = 6379
# password = '123456'
db = 0


# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = project_rag
collection_name = project_rag


# LLM 配置
[llm]
model = qwen3.7-max
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
# 父块大小
parent_chunk_size = 1200
# 子块大小
child_chunk_size = 300
# 父块和字块重叠的中间数: 一般大小为字块的1/5
chunk_overlap = 60
# 粗排结果
retrieval_k = 20
# 精排结果
candidate_m = 5

# 应用配置
[app]
# 不同类型问题分区处理
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
# 客服电话
customer_service_phone = 10086

# BERT 模型训练与推理配置
[bert]
# 预训练模型名称
pre_trained_model_name = bert-base-chinese
# 模型保存目录名
model_path = bert_query_classifier
# 分类标签数量
num_labels = 2
# 文本最大长度
max_length = 128
# 训练集和验证集划分比例
test_size = 0.2
# 随机种子
random_state = 42
# 训练输出目录
output_dir = bert_results
# 最多保存的检查点数量
save_total_limit = 1
# 训练轮次
num_train_epochs = 3
# 训练批次大小
per_device_train_batch_size = 8
# 评估批次大小
per_device_eval_batch_size = 8
# 学习率预热步数
warmup_steps = 500
# 权重衰减系数
weight_decay = 0.01
# 日志目录
logging_dir = ./bert_logs
# 日志记录步数
logging_steps = 10
# 评估策略
evaluation_strategy = epoch
# 保存策略
save_strategy = epoch
# 训练结束后是否加载最佳模型
load_best_model_at_end = True
# 判断最佳模型的指标
metric_for_best_model = eval_loss
# 是否使用FP16混合精度训练
fp16 = False

# 日志配置
[logger]
log_file = ./project-rag/integrated_qa_system/logs/app.log
# 控制台日志级别，可选值: DEBUG, INFO, WARNING, ERROR
console_level = INFO